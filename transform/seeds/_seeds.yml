version: 2

seeds:
  - name: decision_register
    description: >-
      GENERATED by `sapbdc dbt-sources`. The whole decision register as data, so the
      tests in `tests/` can assert against the same decisions `make decide` printed
      rather than against a copy of them someone maintained by hand.
    columns:
      - name: object_id
        data_tests: [unique, not_null]
      - name: mode
        data_tests:
          - not_null
          - accepted_values:
              values: ["SHARE", "REPLICATE", "FEDERATE", "HYBRID", "KEEP_IN_SAP"]
      - name: rule_id
        data_tests: [not_null]
      - name: monthly_eur
        data_tests: [not_null]
