name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege by default; the two jobs that need more ask for it themselves.
permissions:
  contents: read

# A superseded run is wasted minutes and a confusing status check. Tags are exempt:
# a release build should never be cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------------------
  # The decision engine. Unchanged in substance: lint, decide, simulate, test, and
  # gate the committed register against the code that claims to produce it.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Decide (writes the register and the charts)
        run: python -m sapbdc decide

      - name: Simulate (executes all three modes)
        run: python -m sapbdc simulate

      - name: Tests
        run: pytest -q

      # The register is deterministic, so a stale one means the committed decisions
      # no longer match the code that claims to produce them. The simulation report
      # is deliberately excluded: it carries machine-dependent timings.
      - name: The register must match the code that produced it
        run: |
          git diff --exit-code -- reports/decisions.md \
            || (echo "::error::reports/decisions.md is stale — run 'make decide' and commit it" && exit 1)

      - name: Upload the register and the charts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The transformation layer. The bindings are generated from the register, so the
  # interesting failure here is not a broken model — it is a policy change that
  # never reached the dbt layer.
  # ---------------------------------------------------------------------------
  transform:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with the dbt extra
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,dbt]"

      - name: Simulate (the dbt layer reads what the three modes leave on disk)
        run: python -m sapbdc simulate

      - name: Regenerate the dbt bindings from the register
        run: python -m sapbdc dbt-sources

      # The same gate the register gets, for the same reason. If someone moves a
      # threshold in config/policy.yaml and an object changes mode, the generated
      # sources and the decided staging model change with it — and a PR that did not
      # regenerate them is a PR whose marts are reading a binding the architecture no
      # longer chose. That is exactly the drift this repo exists to argue about, so
      # it fails the build rather than waiting to be noticed.
      - name: The dbt bindings must match the register
        run: |
          git diff --exit-code -- transform/models/staging/_sources.yml \
                                  transform/models/staging/stg_journal__decided.sql \
                                  transform/seeds/decision_register.csv \
            || (echo "::error::generated dbt bindings are stale — run 'make dbt-sources' and commit them" && exit 1)

      # Seeds the register, builds staging and marts, and runs every test — including
      # the four singular tests that assert the architecture rather than the SQL:
      # no source may name an object held in SAP, the decided binding must agree with
      # the register, the three bindings must carry the same rows, and only federation
      # may see a change posted after setup.
      - name: dbt build
        working-directory: transform
        run: dbt build --profiles-dir . --fail-fast

      - name: dbt docs
        working-directory: transform
        run: dbt docs generate --profiles-dir .

      - name: Upload the dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: transform/target/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # CD. There is no infrastructure to deploy — the whole thing runs on a laptop by
  # design (ADR-0001) — so what ships is the artifact set: the one page, the
  # register, the charts and the dbt docs, published together so the argument can be
  # read without cloning anything.
  # ---------------------------------------------------------------------------
  # Opt-in: set the repository variable ENABLE_PAGES=true once GitHub Pages is
  # switched to "GitHub Actions" in the repo settings. Without that, deploy-pages
  # fails and turns main red for a reason that has nothing to do with the code.
  publish:
    runs-on: ubuntu-latest
    needs: [verify, transform]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.ENABLE_PAGES == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports

      - uses: actions/download-artifact@v4
        with:
          name: dbt-target
          path: dbt-target

      # `markdown` is installed here and nowhere else: Pages serves a raw .md as
      # plain text, and a register nobody can read is back to being a file in a repo.
      - name: Render the site
        run: |
          python -m pip install -U pip markdown
          python scripts/build_site.py site
          mkdir -p site/dbt
          for f in index.html catalog.json manifest.json; do
            [ -f "dbt-target/$f" ] && cp "dbt-target/$f" site/dbt/
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # A tag ships the wheel with the generated artifacts attached, so a release can be
  # read for what it decided and not only for what it packaged.
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [verify, transform]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            reports/decisions.md
            reports/simulation.md
            reports/crossover.png
            reports/mode-mix.png
          generate_release_notes: true
