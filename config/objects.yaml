# The object catalog — the input to the decision.
#
# 24 objects across a mixed SAP estate (S/4HANA private cloud, ECC, BW/4HANA,
# ERP HCM) plus two inbound objects that live in Snowflake and are needed on the
# SAP side. Sizes, delta capability and consumer profiles are illustrative but
# shaped like the real thing: the ratios between them are what drive the
# decisions, and those ratios are the part worth arguing about.
#
# direction:
#   outbound — SAP → Snowflake (the default case)
#   inbound  — Snowflake → SAP (Datasphere remote table, or Snowflake as a source
#              in a replication flow). The mirror image, and the half most
#              reference architectures forget to draw.
#
# delta_capability:
#   cds    — CDS view extraction, real row-level delta with the annotations intact
#   odp    — ODP-ODQ extractor, delta at extractor granularity
#   slt    — trigger-based replication; delta bought at the price of a trigger
#   none   — no delta; every cycle is a full reload
#   native — the source's own change tracking (Snowflake streams)

