  semantics: high
  consumer:
    queries_per_day: 900
    peak_concurrency: 40
    scan_gb_per_query: 0.9
    result_gb_per_query: 0.05
    latency_slo_seconds: 20
    freshness_slo_minutes: 240
    join_locality: snowflake
    detail_drilldown: true
    detail_queries_per_day: 12
